<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отчётник по неделям</title>
<style>
:root{--bg:#090d19;--panel:#11182b;--panel2:#151e34;--text:#f4f7fb;--muted:#9aa8bf;--accent:#7c9cff;--good:#55d6a5;--line:#26324d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#090d19,#111a2e);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px 18px 50px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.title{font-size:34px;font-weight:800;margin:4px 0}.sub,.muted{color:var(--muted)}
.nav{margin:16px 0}.nav a,.btn,.select{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:10px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.select{font:inherit}
.card{background:rgba(17,24,43,.92);border:1px solid var(--line);border-radius:16px;padding:16px}.chart-card{padding:18px}.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.chart-title{font-size:17px;font-weight:750}
.chart-wrap{height:520px;margin-top:12px;position:relative;overflow:hidden}.chart-wrap svg{width:100%;height:100%}.gridline{stroke:var(--line);stroke-width:1}.axis{fill:var(--muted);font-size:11px}.bar{fill:var(--accent);opacity:.86}.bar.current{fill:var(--good)}.bar:hover{opacity:1}.line{fill:none;stroke:var(--accent);stroke-width:4}.point{fill:var(--panel);stroke:var(--accent);stroke-width:3}.point.current{fill:var(--good);stroke:var(--good)}.week-label{fill:var(--text);font-size:11px}.value-label{fill:var(--text);font-size:11px;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}.legend span{color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px}.dot.good{background:var(--good)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.summary .v{font-size:24px;font-weight:800;margin-top:3px}
.note{margin-top:12px;padding:10px 12px;background:var(--panel2);border-radius:10px;color:var(--muted)}
@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.chart-wrap{height:430px}}@media(max-width:520px){.summary{grid-template-columns:1fr}.title{font-size:28px}.chart-wrap{height:380px}}
</style>
</head>
<body>
<main>
<div class="top"><div><div class="eyebrow">личный отчётник</div><div class="title">Отчётник по неделям</div><div class="sub">Один большой интерактивный график по всем неделям.</div></div><div class="muted" id="period"></div></div>
<div class="nav"><a href="./05.10/dashboard.html">→ Актуальная неделя</a></div>
<div class="controls">
<select id="metric" class="select">
<option value="plan">Выполнение плана, %</option>
<option value="total">Все часы за неделю</option>
<option value="programming">Программирование, ч</option>
<option value="subject">Часы по предмету</option>
</select>
<select id="subject" class="select" hidden>
<option value="russian_hours">Русский</option><option value="math_hours">Математика</option><option value="coach_hours">Степанов</option><option value="team_hours">Командка</option><option value="olympiad_math_hours">ДЮ</option><option value="english_hours">Английский</option><option value="literature_hours">Литература</option><option value="reading_hours">Чтение</option>
</select>
</div>
<section class="card chart-card">
<div class="chart-head"><div><div class="chart-title" id="chartTitle">Выполнение плана</div><div class="muted" id="chartSubtitle"></div></div></div>
<div class="chart-wrap"><svg id="chart" viewBox="0 0 1200 520" preserveAspectRatio="none"></svg></div>
<div class="legend"><span><i class="dot"></i>прошлые недели</span><span><i class="dot good"></i>актуальная неделя</span><span>Нажми на неделю на графике, чтобы открыть её отчёт.</span></div>
<div class="note" id="note"></div>
</section>
<div class="summary" id="summary"></div>
</main>
<script>
"use strict";
const labels={russian_hours:"Русский",math_hours:"Математика",coach_hours:"Степанов",team_hours:"Командка",olympiad_math_hours:"ДЮ",english_hours:"Английский",literature_hours:"Литература",reading_hours:"Чтение"};
let data=[];
const metric=document.querySelector("#metric"), subject=document.querySelector("#subject");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function load(){
 const r=await fetch("data/stats.csv?t="+Date.now(),{cache:"no-store"});
 const txt=await r.text(); const lines=txt.trim().split(/\r?\n/); const h=lines.shift().split(",");
 data=lines.filter(Boolean).map(line=>{const v=line.split(",");const o={};h.forEach((k,i)=>o[k]=v[i]??"");return o});
 render(); document.querySelector("#period").textContent=data.length?"последняя неделя: "+data[data.length-1].week_start+" — "+data[data.length-1].week_end:"";
}
function num(x){const n=Number(x);return Number.isFinite(n)?n:0}
function value(row){
 if(metric.value==="plan")return num(row.plan_percent);
 if(metric.value==="total")return num(row.work_hours);
 if(metric.value==="programming")return num(row.programming_hours);
 return num(row[subject.value]);
}
function title(){
 if(metric.value==="plan")return "Выполнение плана";
 if(metric.value==="total")return "Все часы за неделю";
 if(metric.value==="programming")return "Программирование";
 return labels[subject.value];
}
function render(){
 subject.hidden=metric.value!=="subject";
 const vals=data.map(value), max=Math.max(1,...vals), W=1200,H=520,L=70,R=35,T=34,B=70;
 const innerW=W-L-R, innerH=H-T-B, step=data.length>1?innerW/(data.length-1):innerW;
 let svg="";
 for(let i=0;i<=5;i++){const y=T+innerH-i*innerH/5;const v=max*i/5;svg+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="axis" x="${L-10}" y="${y+4}" text-anchor="end">${v%1?v.toFixed(1):v}</text>`;}
 const points=data.map((row,i)=>({x:data.length===1?L+innerW/2:L+i*step,y:T+innerH-(value(row)/max)*innerH,row,i}));
 const path=points.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
 const barW=Math.min(70,Math.max(18,innerW/Math.max(1,data.length*1.7)));
 if(metric.value==="plan"){
   points.forEach((p,i)=>{const y0=T+innerH;const h=y0-p.y;const x=p.x-barW/2;const cur=i===points.length-1;svg+=`<rect class="bar ${cur?"current":""}" x="${x}" y="${p.y}" width="${barW}" height="${Math.max(1,h)}" rx="8"><title>${p.row.week_start}: ${value(p.row).toFixed(1)}%</title></rect>`;});
 }else{
   svg+=`<path class="line" d="${path}"/>`;
   points.forEach((p,i)=>{const cur=i===points.length-1;svg+=`<circle class="point ${cur?"current":""}" cx="${p.x}" cy="${p.y}" r="7"><title>${p.row.week_start}: ${value(p.row).toFixed(1)} ч</title></circle>`;});
 }
 points.forEach((p,i)=>{const cur=i===points.length-1;const x=p.x;svg+=`<a href="./${p.row.week_start.slice(8,10)}.${p.row.week_start.slice(5,7)}/dashboard.html"><g style="cursor:pointer"><text class="value-label" x="${x}" y="${Math.max(16,p.y-13)}" text-anchor="middle">${metric.value==="plan"?value(p.row).toFixed(1)+"%":value(p.row).toFixed(1)+" ч"}</text><text class="week-label" x="${x}" y="${H-38}" text-anchor="middle">${p.row.week_start.slice(8)}.${p.row.week_start.slice(5,7)}</text></g></a>`;});
 document.querySelector("#chart").innerHTML=svg;
 document.querySelector("#chartTitle").textContent=title();
 document.querySelector("#chartSubtitle").textContent="Недели: "+data[0]?.week_start+" — "+data[data.length-1]?.week_end;
 const cur=data[data.length-1], prev=data[data.length-2];
 const summary=[
  ["План, ч",num(cur?.planned_hours).toFixed(1)],
  ["Факт, ч",num(cur?.work_hours).toFixed(1)],
  ["Выполнение",num(cur?.plan_percent).toFixed(1)+"%"],
  ["Программирование, ч",num(cur?.programming_hours).toFixed(1)]
 ];
 document.querySelector("#summary").innerHTML=summary.map(x=>'<div class="card"><div class="muted">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div></div>').join("");
 document.querySelector("#note").textContent=cur?.notes||"";
}
metric.addEventListener("change",render);subject.addEventListener("change",render);load().catch(()=>document.querySelector("#note").textContent="Не удалось загрузить данные.");
</script>
</body>
</html>
