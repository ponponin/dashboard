name: Update Codeforces snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-codeforces.yml"

permissions:
  contents: write

concurrency:
  group: codeforces-snapshot
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Codeforces rating history
        shell: bash
        run: |
          set -euo pipefail

          ok=0
          for url in             "https://codeforces.com/api/user.rating?handle=pon"             "https://mirror.codeforces.com/api/user.rating?handle=pon"             "https://codeforces.org/api/user.rating?handle=pon"; do
            echo "Trying $url"
            if curl -fsSL --retry 10 --retry-delay 4 --retry-all-errors --max-time 40 "$url" -o /tmp/rating.json; then
              node -e 'const x=require("/tmp/rating.json"); if(x.status==="OK" && Array.isArray(x.result)){process.exit(0)} process.exit(1)' && ok=1 && break
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "::warning::Codeforces API unavailable. Keeping the previous snapshot."
            exit 0
          fi

          node <<'NODE'
          const fs = require("fs");
          const api = JSON.parse(fs.readFileSync("/tmp/rating.json","utf8"));
          const history = api.result.slice(-100);
          const latest = history[history.length - 1];
          const recent_divs = history
            .filter(x => /Div\.? ?[123]/i.test(x.contestName))
            .slice(-5)
            .reverse()
            .map(x => ({
              name: x.contestName,
              date: new Date(x.ratingUpdateTimeSeconds * 1000).toISOString().slice(0,10),
              rank: x.rank,
              oldRating: x.oldRating,
              newRating: x.newRating,
              delta: x.newRating - x.oldRating
            }));

          const snapshot = {
            handle: "pon",
            updated_at: new Date().toISOString(),
            rating: latest ? latest.newRating : null,
            history,
            recent_divs
          };

          fs.writeFileSync("data/codeforces.json",JSON.stringify(snapshot,null,2)+"\n");
          NODE

      - name: Commit changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/codeforces.json; then
            echo "Codeforces snapshot has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codeforces.json
          git commit -m "Update Codeforces snapshot"
          git push
