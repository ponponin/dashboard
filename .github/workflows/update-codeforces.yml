name: Update Codeforces snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-codeforces.yml"

permissions:
  contents: write

concurrency:
  group: codeforces-snapshot
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Codeforces rating history
        shell: bash
        run: |
          set -euo pipefail

          if ! curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors --max-time 30             "https://codeforces.com/api/user.rating?handle=pon"             -o /tmp/rating.json; then
            echo "::warning::Codeforces API is temporarily unavailable. Keeping the previous snapshot."
            exit 0
          fi

          node <<'NODE'
          const fs = require("fs");

          const api = JSON.parse(fs.readFileSync("/tmp/rating.json", "utf8"));
          if (api.status !== "OK" || !Array.isArray(api.result)) {
            throw new Error("Codeforces rating API returned an invalid response");
          }

          const history = api.result.slice(-100);
          const latest = history[history.length - 1];

          const snapshot = {
            handle: "pon",
            updated_at: new Date().toISOString(),
            rating: latest ? latest.newRating : null,
            history
          };

          fs.writeFileSync(
            "data/codeforces.json",
            JSON.stringify(snapshot, null, 2) + "\n"
          );
          NODE

      - name: Commit changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/codeforces.json; then
            echo "Codeforces snapshot has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codeforces.json
          git commit -m "Update Codeforces snapshot"
          git push
