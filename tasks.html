<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задачи</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(145deg,#f5f7fb,#eef2f7);color:#18202a}
main{max-width:1100px;margin:0 auto;padding:32px 18px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#5267d9}.dashboard-link{background:#18202a;color:white;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:16px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:#667085}
h1{margin-bottom:6px}.muted{color:#667085}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{border:1px solid #d0d5dd;background:white;border-radius:9px;padding:8px 12px;cursor:pointer}button.active{background:#18202a;color:white}.grid{display:grid;gap:12px}
.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;box-shadow:0 2px 7px rgba(16,24,40,.04)}.title-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.task-title{font-weight:700}.badge{font-size:12px;padding:4px 9px;border-radius:999px;background:#eef2f6;display:inline-block}.high{background:#ffe4e4}.medium{background:#fff0c7}.low{background:#e5f4e8}.meta{font-size:13px;color:#667085;margin-top:5px}.notes{font-size:12px;color:#667085;margin-top:8px}.hours{font-weight:700;white-space:nowrap}.hours small{display:block;color:#667085;font-weight:500;font-size:11px;text-align:right}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.card{grid-template-columns:1fr}.hours small{text-align:left}}
</style></head><body><main>
<div class="top"><div><div class="eyebrow">ПЛАНИРОВЩИК</div><h1>Задачи</h1><div class="muted">Приоритеты, сроки, прогресс и часы</div></div><a class="dashboard-link" href="dashboard.html">Открыть главный дашборд →</a></div>
<div class="stats" id="stats"></div><div class="bar" id="filters"></div><div class="grid" id="list">Загрузка…</div>
</main><script>
let tasks=[],filter='all';
function parseCSV(s){const rows=[];let row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c=='"'){if(q&&s[i+1]=='"'){cell+='"';i++}else q=!q}else if(c==','&&!q){row.push(cell);cell=''}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&s[i+1]=='\n')i++;row.push(cell);cell='';if(row.some(x=>x))rows.push(row);row=[]}else cell+=c}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])));}
function render(){const done=tasks.filter(t=>['done','completed'].includes((t.status||'').toLowerCase())).length;document.getElementById('stats').innerHTML='<div class="stat"><span>Всего задач</span><b>'+tasks.length+'</b></div><div class="stat"><span>Высокий приоритет</span><b>'+tasks.filter(t=>t.priority==='high').length+'</b></div><div class="stat"><span>Готово</span><b>'+done+'</b></div>';let a=tasks.filter(t=>filter==='all'||t.priority===filter);a.sort((x,y)=>({high:0,medium:1,low:2}[x.priority]-({high:0,medium:1,low:2}[y.priority])||((x.deadline||'9999').localeCompare(y.deadline||'9999')));document.getElementById('list').innerHTML=a.map(t=>'<div class="card"><div><div class="title-row"><span class="task-title">'+t.task+'</span><span class="badge '+t.priority+'">'+t.priority+'</span></div><div class="meta">'+t.status+(t.deadline?' · срок: '+t.deadline:' · без дедлайна')+'</div><div class="notes">'+(t.notes||'')+'</div></div><div class="hours">'+t.actual_hours+'/'+(t.planned_hours||0)+' ч<small>факт / план</small></div></div>').join('')||'Нет задач';}
['all','high','medium','low'].forEach(x=>{let b=document.createElement('button');b.textContent=x==='all'?'Все':x==='high'?'Высокий':x==='medium'?'Средний':'Низкий';if(x==='all')b.className='active';b.onclick=()=>{filter=x;document.querySelectorAll('button').forEach(z=>z.classList.remove('active'));b.classList.add('active');render()};document.getElementById('filters').append(b)});fetch('data/tasks.csv').then(r=>r.text()).then(s=>{tasks=parseCSV(s);render()}).catch(()=>document.getElementById('list').textContent='Не удалось загрузить задачи');
</script></body></html>
