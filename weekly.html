<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трекер недели</title>
<style>
body{margin:0;background:#0b0d12;color:#e9edf5;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0}.sub{color:#8f98a8}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#131720;border:1px solid #252b36;border-radius:14px;padding:16px}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#202735;color:#a9c5ff;font-size:12px}.done{opacity:.55}.task{font-size:17px;margin:12px 0}.meta{color:#8f98a8}.bar{height:6px;background:#252b36;border-radius:5px;margin-top:12px}.fill{height:100%;background:#8db4ff;border-radius:5px}
.nav a{color:#8db4ff;margin-right:16px;text-decoration:none}
</style></head><body><main><div class="nav"><a href="dashboard.html">Главный</a><a href="reports.html">Отчётник</a></div><div class="top"><div><h1>Трекер недели</h1><div class="sub" id="period"></div></div><div class="sub">Планы текущей недели • каждое воскресенье новая неделя</div></div><div id="grid" class="grid"></div>
<script>
function monday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function sunday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n+6);return d.toISOString().slice(0,10)}
async function csv(p){let s=await fetch(p+'?v='+Date.now()).then(r=>r.text());let a=s.trim().split(/\r?\n/);let h=a.shift().split(',');return a.filter(Boolean).map(x=>{let v=x.split(',');let o={};h.forEach((k,i)=>o[k]=v[i]??'');return o})}
(async()=>{let ws=monday(new Date()),we=sunday(new Date());document.querySelector('#period').textContent=ws+' — '+we;let all=await csv('data/weekly_plans.csv');let d=all.filter(x=>x.week_start===ws);if(!d.length)d=all.filter(x=>x.week_start<=ws&&x.week_end>=ws);document.querySelector('#grid').innerHTML=d.map(x=>{let p=x.planned_hours>0?Math.min(100,Number(x.actual_hours)/Number(x.planned_hours)*100):0;return '<div class="card '+(x.status==='done'?'done':'')+'"><span class="badge">'+x.category+' · '+x.priority+'</span><div class="task">'+x.task+'</div><div class="meta">'+x.status+' · '+x.actual_hours+'/'+x.planned_hours+' ч</div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div>'}).join('')||'<div class="card">На текущую неделю планов пока нет.</div>'})()
</script></main></body></html>
